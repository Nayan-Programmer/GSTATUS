<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GStar Top 10 Ceremony — {{ config.portal_title }}</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.jpg') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #f5c451; --gold-soft: #ffe6a6; --gold-deep: #c98a12; --maroon: #3a0000; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--maroon); font-family: "Manrope", system-ui, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; }

    .stage {
      position: fixed; inset: 0; cursor: pointer;
      background: var(--maroon) url("{{ url_for('static', filename='rank/bg.png') }}") center / cover no-repeat;
    }
    #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

    .content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 4vh 4vw 11vh; }
    .view { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2.4vh; width: 100%; animation: viewIn 0.6s ease both; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .gold {
      background: linear-gradient(180deg, #fff3c4 0%, var(--gold) 45%, var(--gold-deep) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 3px 10px rgba(50, 0, 0, 0.7));
    }
    .serif { font-family: "Cinzel", Georgia, "Times New Roman", serif; }

    /* ---- intro / finale ---- */
    .trophy { font-size: clamp(3rem, 14vh, 8rem); filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.5)); animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-1.4vh); } }
    .title { font-weight: 900; font-size: clamp(1.5rem, min(9vh, 8.5vw), 6rem); letter-spacing: 0.06em; overflow-wrap: anywhere; text-transform: uppercase; line-height: 1.1; margin: 0; max-width: 92vw; }
    .tagline { font-size: clamp(0.9rem, 2.6vh, 1.5rem); color: var(--gold-soft); letter-spacing: 0.16em; text-transform: uppercase; text-shadow: 0 2px 12px rgba(40, 0, 0, 0.8); margin: 0; max-width: 90vw; }
    .begin { margin-top: 3vh; font-size: clamp(0.9rem, 2.4vh, 1.3rem); letter-spacing: 0.2em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); animation: blinkSoft 1.6s ease-in-out infinite; }
    @keyframes blinkSoft { 50% { opacity: 0.35; } }

    /* ---- rank slide ---- */
    .rank-label { font-weight: 900; font-size: clamp(1.5rem, min(7.5vh, 9vw), 5rem); letter-spacing: 0.12em; text-transform: uppercase; min-height: 1.15em; margin: 0; white-space: nowrap; }
    .caret { display: inline-block; width: 0.07em; height: 0.85em; margin-left: 0.1em; background: var(--gold-soft); vertical-align: -0.06em; animation: caret 0.9s steps(1) infinite; box-shadow: 0 0 10px rgba(255, 230, 166, 0.8); }
    @keyframes caret { 50% { opacity: 0; } }
    .revealed .caret { display: none; }

    .photo-wrap { --pd: min(38vh, 68vw, 360px); position: relative; width: var(--pd); height: var(--pd); }
    .flip { width: 100%; height: 100%; perspective: 1400px; }
    .flip-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 1.15s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .revealed .flip-inner { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
    .front {
      background: radial-gradient(circle at 30% 25%, #8d1010, #2a0000 75%);
      border: 0.55vh solid rgba(245, 196, 81, 0.8);
      box-shadow: 0 0 0 0.9vh rgba(245, 196, 81, 0.14), 0 22px 60px rgba(0, 0, 0, 0.55), inset 0 0 40px rgba(0, 0, 0, 0.5);
      display: grid; place-items: center;
    }
    .q { font-size: calc(var(--pd) * 0.52); font-weight: 900; animation: pulseQ 1.8s ease-in-out infinite; }
    @keyframes pulseQ { 50% { transform: scale(1.07); opacity: 0.85; } }
    .back {
      transform: rotateY(180deg);
      border: 0.75vh solid var(--gold);
      background: #4a0808;
      box-shadow: 0 0 0 0.9vh rgba(245, 196, 81, 0.25), 0 0 70px rgba(245, 196, 81, 0.55), 0 22px 60px rgba(0, 0, 0, 0.55);
      display: grid; place-items: center;
    }
    .back img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
    .initials { font-weight: 900; font-size: calc(var(--pd) * 0.36); letter-spacing: 0.04em; }

    .badge {
      position: absolute; right: -4%; bottom: -1%; width: calc(var(--pd) * 0.34); aspect-ratio: 1; border-radius: 50%;
      display: grid; place-items: center; color: #5a0505; font-weight: 900; font-size: calc(var(--pd) * 0.135); line-height: 1;
      background: radial-gradient(circle at 30% 25%, #fff8dc, var(--gold) 55%, #b97a0a);
      border: 0.5vh solid #fff3c4; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      transform: scale(0) rotate(-40deg); transition: transform 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) 0.95s;
    }
    .badge small { font-size: 0.5em; vertical-align: 0.5em; margin-left: 0.04em; }
    .revealed .badge { transform: scale(1) rotate(0); }

    .info { display: grid; justify-items: center; min-height: 12vh; width: 100%; }
    .info > * { grid-area: 1 / 1; }
    .who { display: flex; flex-direction: column; align-items: center; gap: 1vh; opacity: 0; transform: translateY(22px) scale(0.96); transition: opacity 0.9s ease 0.75s, transform 0.9s ease 0.75s; }
    .revealed .who { opacity: 1; transform: none; }
    .name { font-weight: 900; font-size: clamp(1.6rem, 6.2vh, 4.2rem); letter-spacing: 0.06em; line-height: 1.1; max-width: 92vw; text-shadow: 0 4px 22px rgba(40, 0, 0, 0.85); overflow-wrap: anywhere; }
    .sub { font-size: clamp(0.85rem, 2.4vh, 1.5rem); color: var(--gold-soft); letter-spacing: 0.18em; text-transform: uppercase; text-shadow: 0 2px 10px rgba(40, 0, 0, 0.85); }
    .hint { align-self: start; font-size: clamp(0.8rem, 2.2vh, 1.2rem); letter-spacing: 0.24em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); animation: blinkSoft 1.6s ease-in-out infinite; transition: opacity 0.3s; }
    .revealed .hint { opacity: 0; animation: none; }

    /* ---- finale ---- */
    .podium { display: flex; align-items: flex-end; justify-content: center; gap: clamp(14px, 4vw, 56px); flex-wrap: wrap; }
    .pod { --pd: min(22vh, 26vw, 220px); display: flex; flex-direction: column; align-items: center; gap: 1vh; max-width: 28vw; min-width: 120px; }
    .pod.first { --pd: min(29vh, 34vw, 290px); }
    .pod .photo-wrap { --pd: inherit; }
    .pod .disc { position: relative; width: var(--pd); height: var(--pd); }
    .pod .disc .ring { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 0.7vh solid var(--gold); background: #4a0808; box-shadow: 0 0 50px rgba(245, 196, 81, 0.5), 0 16px 40px rgba(0, 0, 0, 0.5); display: grid; place-items: center; }
    .pod .disc .ring img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
    .pod .disc .badge { transform: none; transition: none; }
    .pod .pname { font-weight: 900; font-size: clamp(0.95rem, 3vh, 2rem); letter-spacing: 0.05em; text-shadow: 0 3px 14px rgba(40, 0, 0, 0.85); overflow-wrap: anywhere; text-align: center; }
    .pod .psub { font-size: clamp(0.7rem, 1.8vh, 1.1rem); color: var(--gold-soft); letter-spacing: 0.14em; text-transform: uppercase; text-shadow: 0 2px 8px rgba(40, 0, 0, 0.85); text-align: center; }

    /* ---- controls ---- */
    .hud { position: fixed; left: 0; right: 0; bottom: 2.6vh; display: flex; align-items: center; justify-content: center; gap: 12px; z-index: 10; transition: opacity 0.5s; }
    .hud.hide { opacity: 0; pointer-events: none; }
    .pill, .round {
      font: 700 0.85rem "Manrope", system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-soft);
      background: rgba(30, 0, 0, 0.55); border: 1px solid rgba(245, 196, 81, 0.55); backdrop-filter: blur(6px); cursor: pointer; transition: background 0.2s, transform 0.15s;
    }
    .pill { padding: 12px 20px; border-radius: 999px; }
    .pill.primary { background: linear-gradient(100deg, #f5c451, #ffe6a6); color: #4a0808; border-color: #fff3c4; }
    .pill:hover, .round:hover { background: rgba(80, 0, 0, 0.75); transform: translateY(-1px); }
    .pill.primary:hover { background: linear-gradient(100deg, #ffd56b, #fff3c4); }
    .pill[disabled] { opacity: 0.35; pointer-events: none; }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.28); }
    .dots i.on { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
    .tools { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 10; transition: opacity 0.5s; }
    .tools.hide { opacity: 0; pointer-events: none; }
    .round { width: 42px; height: 42px; border-radius: 50%; font-size: 1.05rem; padding: 0; letter-spacing: 0; display: grid; place-items: center; text-decoration: none; }

    .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 20; max-width: min(92vw, 640px); padding: 12px 18px; border-radius: 14px; background: rgba(20, 0, 0, 0.85); border: 1px solid var(--gold); color: #fff; font-size: 0.9rem; line-height: 1.4; text-align: center; }
    .empty a { color: var(--gold-soft); }

    @media (max-width: 640px) {
      .pill { padding: 11px 15px; font-size: 0.75rem; }
      .dots { display: none; }
      .rank-label { letter-spacing: 0.08em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flip-inner, .badge, .who { transition-duration: 0.01s; transition-delay: 0s; }
      .view, .trophy, .q, .begin, .hint { animation: none; }
    }
  
    /* ---- room ceremony additions ---- */
    .room-chip { font-size: clamp(0.85rem, 2.6vh, 1.5rem); letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-soft);
      padding: 0.35em 1.1em; border: 1px solid rgba(245, 196, 81, 0.6); border-radius: 999px; background: rgba(30, 0, 0, 0.45); text-shadow: 0 2px 10px rgba(40, 0, 0, 0.8); }
    .roomno { font-weight: 900; font-size: calc(var(--pd) * 0.3); letter-spacing: 0.02em; line-height: 1; }
    .roomno small { display: block; font-size: 0.32em; letter-spacing: 0.3em; margin-bottom: 0.3em; }
    .quick .flip-inner { transition-duration: 0.8s; }

    .standings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.1vh; width: min(760px, 92vw); }
    .standings li { display: grid; grid-template-columns: 3.2em 1fr auto; align-items: center; gap: 0.8em; padding: 0.55em 1em; border-radius: 14px;
      background: rgba(30, 0, 0, 0.55); border: 1px solid rgba(245, 196, 81, 0.35); font-size: clamp(0.95rem, 3vh, 1.7rem); text-align: left; backdrop-filter: blur(4px); }
    .standings li.top { border-color: var(--gold); background: linear-gradient(90deg, rgba(245, 196, 81, 0.28), rgba(30, 0, 0, 0.55)); }
    .standings .rk { font-weight: 900; color: var(--gold-soft); }
    .standings .rn { font-weight: 900; letter-spacing: 0.04em; overflow-wrap: anywhere; }
    .standings .rs { font-variant-numeric: tabular-nums; color: var(--gold-soft); font-weight: 700; white-space: nowrap; }
    .standings .rs small { font-size: 0.6em; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; margin-left: 0.3em; }
    .standings.dense li { padding: 0.35em 0.9em; font-size: clamp(0.8rem, 2.2vh, 1.2rem); }

    .toppers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 80vw), 1fr)); gap: 1.6vh 2vw; width: min(1100px, 92vw); }
    .tcard { display: flex; align-items: center; gap: 0.9em; padding: 0.7em 0.9em; border-radius: 16px; background: rgba(30, 0, 0, 0.55); border: 1px solid rgba(245, 196, 81, 0.45); text-align: left; min-width: 0; }
    .tcard .mini { flex: none; width: clamp(48px, 9vh, 84px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 3px solid var(--gold); background: #4a0808; display: grid; place-items: center; }
    .tcard .mini img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
    .tcard .mini .initials { font-size: clamp(18px, 3.4vh, 32px); }
    .tcard .tt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .tcard .troom { font-size: clamp(0.65rem, 1.6vh, 0.9rem); letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-soft); }
    .tcard .tname { font-weight: 900; font-size: clamp(0.9rem, 2.6vh, 1.4rem); letter-spacing: 0.04em; overflow-wrap: anywhere; }
    .tcard .tpts { font-size: clamp(0.7rem, 1.7vh, 0.95rem); color: var(--gold-soft); }
    .finale-view { gap: 1.6vh; }
    .finale-view .pod { --pd: min(15vh, 22vw, 160px); }
    .finale-view .pod.first { --pd: min(19vh, 28vw, 200px); }
    .finale-view .toppers { grid-template-columns: repeat(auto-fit, minmax(min(240px, 80vw), 1fr)); width: min(1180px, 94vw); }
    .finale-view .tcard .tname { overflow-wrap: break-word; word-break: normal; }
    @media (max-width: 640px) {
      .finale-view .toppers { grid-template-columns: 1fr 1fr; gap: 6px; }
      .finale-view .tcard { padding: 0.35em 0.5em; }
      .finale-view .tcard .mini { display: none; }
      .finale-view .tcard .tname { font-size: 0.8rem; }
      .finale-view .pod { --pd: min(12vh, 24vw, 120px); min-width: 0; }
      .finale-view .pod.first { --pd: min(15vh, 30vw, 150px); }
    }
    .finale-view .tcard { padding: 0.45em 0.7em; }
    .finale-view .tcard .mini { width: clamp(36px, 6vh, 56px); }
    .counter { font: 700 0.8rem "Manrope", system-ui, sans-serif; letter-spacing: 0.14em; color: var(--gold-soft); min-width: 5.5em; text-align: center; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="confetti"></canvas>
    <div class="content" id="content"></div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>

  <div class="tools" id="tools">
    <button class="round" id="muteBtn" title="Mute / unmute (M)" aria-label="Mute or unmute">🔊</button>
    <button class="round" id="fsBtn" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
    <a class="round" id="adminLink" href="/rank/gstar/admin" title="Add photos" aria-label="Add photos">⚙</a>
    <a class="round" href="/leaderboard?view=gstar" title="GStar leaderboard" aria-label="Leaderboard">🏆</a>
  </div>

  <div class="hud" id="hud">
    <button class="pill" id="backBtn">◀ Back</button>
    <span class="counter" id="counter"></span>
    <button class="pill primary" id="nextBtn">Begin ▶</button>
  </div>

  <script>
  (function () {
    var SUSPENSE_URL = "{{ url_for('static', filename='rank/suspense.mp3') }}";
    var FANFARE_URL = "{{ url_for('static', filename='rank/fanfare.mp3') }}";
    var params = new URLSearchParams(location.search);
    var q = [];
    if (params.get("top")) q.push("top=" + encodeURIComponent(params.get("top")));
    if (params.get("source")) q.push("source=" + encodeURIComponent(params.get("source")));
    var API = "/api/rank/gstar" + (q.length ? "?" + q.join("&") : "");
    document.getElementById("adminLink").href = "/rank/gstar/admin" + (q.length ? "?" + q.join("&") : "");
    var WORDS = { 1: "First", 2: "Second", 3: "Third" };
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var $ = function (id) { return document.getElementById(id); };
    var content = $("content"), stage = $("stage"), hud = $("hud"), tools = $("tools");
    var nextBtn = $("nextBtn"), backBtn = $("backBtn");
    var cfg = null, steps = [], idx = 0, view = null, typing = null, lastNav = 0;

    /* ---------------- audio (same files as /rank) ---------------- */
    var suspense = new Audio(SUSPENSE_URL); suspense.loop = true; suspense.preload = "auto"; suspense.volume = 0;
    var fanfare = new Audio(FANFARE_URL); fanfare.preload = "auto"; fanfare.volume = 1;
    var muted = false, wantSuspense = false, toastTimer = null;
    function toast(msg, ms) {
      var el = $("toast"); el.textContent = msg; el.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, ms || 6000);
    }
    suspense.addEventListener("error", function () { toast("Music file could not be loaded: " + SUSPENSE_URL, 10000); });
    fanfare.addEventListener("error", function () { toast("Fanfare file could not be loaded: " + FANFARE_URL, 10000); });
    function fade(audio, to, ms, done) {
      clearInterval(audio._fade);
      var from = audio.volume, n = Math.max(1, Math.round(ms / 40)), i = 0;
      audio._fade = setInterval(function () {
        i++; audio.volume = Math.min(1, Math.max(0, from + (to - from) * i / n));
        if (i >= n) { clearInterval(audio._fade); if (done) done(); }
      }, 40);
    }
    function safePlay(audio) {
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        if (err && err.name === "NotAllowedError") toast("Your browser blocked the sound. Click the 🔊 button or press Next again.", 8000);
        else if (err && err.name !== "AbortError") toast("Sound could not start (" + (err.name || "error") + ").", 8000);
      });
    }
    function startSuspense() {
      wantSuspense = true;
      if (muted) toast("Sound is muted — press M or click 🔇 to unmute.", 5000);
      if (suspense.paused) { suspense.currentTime = 0; suspense.volume = 0; safePlay(suspense); }
      fade(suspense, 0.85, 900);
    }
    function stopSuspense(ms) { wantSuspense = false; fade(suspense, 0, ms || 500, function () { suspense.pause(); }); }
    function stopFanfare() { fade(fanfare, 0, 250, function () { fanfare.pause(); fanfare.currentTime = 0; fanfare.volume = 1; }); }
    function playFanfare() { clearInterval(fanfare._fade); fanfare.pause(); fanfare.currentTime = 0; fanfare.volume = 1; safePlay(fanfare); }

    /* ---------------- confetti ---------------- */
    var cv = $("confetti"), cx = cv.getContext("2d"), bits = [], raf = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    function sizeCanvas() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
    sizeCanvas(); addEventListener("resize", sizeCanvas);
    var COLORS = ["#f5c451", "#ffe6a6", "#ffffff", "#ff5a5a", "#c98a12", "#ffd56b"];
    function burst(scale) {
      if (reduceMotion) return;
      scale = scale || 1;
      var W = cv.width, H = cv.height, i, side, n = Math.round(90 * scale);
      for (side = 0; side < 2; side++) for (i = 0; i < n; i++) {
        bits.push({ x: side ? W : 0, y: H * 0.78, vx: (side ? -1 : 1) * (4 + Math.random() * 10) * dpr, vy: -(9 + Math.random() * 14) * dpr,
          w: (6 + Math.random() * 8) * dpr, h: (3 + Math.random() * 6) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: COLORS[(Math.random() * COLORS.length) | 0] });
      }
      for (i = 0; i < Math.round(140 * scale); i++) {
        bits.push({ x: Math.random() * W, y: -Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 3 * dpr, vy: (1 + Math.random() * 3) * dpr,
          w: (5 + Math.random() * 7) * dpr, h: (3 + Math.random() * 5) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: COLORS[(Math.random() * COLORS.length) | 0] });
      }
      if (!raf) raf = requestAnimationFrame(tick);
    }
    function tick() {
      cx.clearRect(0, 0, cv.width, cv.height);
      var g = 0.32 * dpr, alive = [];
      bits.forEach(function (b) {
        b.vy += g; b.vx *= 0.992; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if (b.y < cv.height + 40) {
          alive.push(b);
          cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c;
          cx.scale(1, Math.abs(Math.cos(b.r * 1.7)) * 0.8 + 0.2);
          cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); cx.restore();
        }
      });
      bits = alive;
      raf = bits.length ? requestAnimationFrame(tick) : 0;
      if (!bits.length) cx.clearRect(0, 0, cv.width, cv.height);
    }
    function clearConfetti() { bits = []; }

    /* ---------------- helpers ---------------- */
    function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
    function ord(n) { var v = n % 100; return n + (v >= 11 && v <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th")); }
    function sfx(n) { return ord(n).replace(/^\d+/, ""); }
    function initials(name) { return (name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase(); }
    function studentFace(s) {
      return s.photo ? '<img src="' + esc(s.photo) + '" alt="' + esc(s.name) + '" />' : '<span class="initials serif gold">' + esc(initials(s.name)) + "</span>";
    }
    function roomFace(r) {
      var num = String(r.room).length <= 5 ? r.room : initials(r.label);
      return '<span class="roomno serif gold"><small>Room</small>' + esc(num) + "</span>";
    }
    function badgeHtml(n) { return '<div class="badge serif"><span>' + n + "<small>" + sfx(n) + "</small></span></div>"; }
    function cancelTyping() { if (typing) { clearTimeout(typing); typing = null; } }
    function typeInto(el, text, instant) {
      cancelTyping();
      if (instant || reduceMotion) { el.textContent = text; return; }
      var i = 0;
      (function step() {
        el.textContent = text.slice(0, ++i);
        if (i < text.length) typing = setTimeout(step, 85 + Math.random() * 60);
        else typing = null;
      })();
    }
    function roomScore(r) { return r.score_label + " " + cfg.score_unit + " · " + r.students + " students"; }
    function studentSub(s) { return [s["class"], s.points_label + " pts"].filter(Boolean).join(" · "); }

    /* ---------------- views ---------------- */
    function mount(html, cls) {
      content.innerHTML = '<div class="view ' + (cls || "") + '">' + html + "</div>";
      view = content.firstChild; return view;
    }
    function renderMessage(title, line) {
      mount('<div class="trophy">🌟</div><h1 class="title serif gold">' + esc(title) + '</h1><p class="tagline empty">' + line + "</p>");
    }
    function starSub(s) {
      var where = s.kind === "Hostel" ? (s.room ? "Hostel · Room " + s.room : "Hostel") : "Day School";
      return [s["class"], where, s.points_label + " " + cfg.points_word].filter(Boolean).join(" · ");
    }
    function renderIntro() {
      mount('<div class="trophy">🌟</div><h1 class="title serif gold">' + esc(cfg.title) + "</h1>" +
        (cfg.subtitle ? '<p class="tagline">' + esc(cfg.subtitle) + "</p>" : "") +
        '<p class="tagline">Hostel &amp; Day School together' + (cfg.period ? " · " + esc(cfg.period) : "") + "</p>" +
        '<div class="begin">Click or press → to begin</div>');
    }
    function renderPart(kicker, title, line) {
      mount('<p class="tagline">' + esc(kicker) + '</p><h1 class="title serif gold">' + esc(title) + "</h1>" +
        (line ? '<p class="tagline">' + esc(line) + "</p>" : ""));
    }
    function renderCard(s, revealed, animateTyping, quick) {
      var label = s.rank <= 3 ? WORDS[s.rank] + " rank" : "Rank " + s.rank;
      mount('<div class="room-chip">' + esc(cfg.title) + "</div>" +
        '<h2 class="rank-label serif gold"><span class="typed"></span><i class="caret"></i></h2>' +
        '<div class="photo-wrap"><div class="flip"><div class="flip-inner">' +
        '<div class="face front"><span class="q serif gold">?</span></div>' +
        '<div class="face back">' + studentFace(s) + "</div></div></div>" + badgeHtml(s.rank) + "</div>" +
        '<div class="info"><div class="who"><div class="name serif">' + esc(s.name) + "</div>" +
        '<div class="sub">' + esc(starSub(s)) + "</div></div>" +
        '<div class="hint">Click for the reveal</div></div>', (revealed ? "revealed " : "") + (quick ? "quick" : ""));
      view.dataset.key = "star-" + s.rank;
      typeInto(view.querySelector(".typed"), label, !animateTyping);
    }
    function cardsHtml(list) {
      return '<div class="toppers">' + list.map(function (s) {
        return '<div class="tcard"><div class="mini">' + studentFace(s) + '</div><div class="tt"><span class="troom">' + ord(s.rank) + " · " + esc(s.kind) +
          '</span><span class="tname serif">' + esc(s.name) + '</span><span class="tpts">' + esc(s.points_label) + " " + esc(cfg.points_word) + "</span></div></div>";
      }).join("") + "</div>";
    }
    function renderWall() {
      var rest = cfg.stars.filter(function (s) { return s.rank > 3; });
      mount('<p class="tagline">' + esc(cfg.title) + '</p><h1 class="title serif gold" style="font-size:clamp(1.4rem,min(7vh,7vw),4.5rem)">Our Stars ' +
        rest[0].rank + "–" + rest[rest.length - 1].rank + "</h1>" + cardsHtml(rest));
    }
    function renderFinale() {
      var top3 = cfg.stars.filter(function (s) { return s.rank <= 3; });
      var rest = cfg.stars.filter(function (s) { return s.rank > 3; });
      var order = [];
      [2, 1, 3].forEach(function (n) { top3.forEach(function (s) { if (s.rank === n) order.push(s); }); });
      mount('<h1 class="title serif gold" style="font-size:clamp(1.3rem,min(6vh,6vw),3.6rem)">Congratulations, ' + esc(cfg.title) + "!</h1>" +
        '<div class="podium" style="--shrink:1">' + order.map(function (s) {
          return '<div class="pod ' + (s.rank === 1 ? "first" : "") + '"><div class="disc"><div class="ring">' + studentFace(s) + "</div>" + badgeHtml(s.rank) + "</div>" +
            '<div class="pname serif">' + esc(s.name) + '</div><div class="psub">' + esc(s.points_label) + " " + esc(cfg.points_word) + "</div></div>";
        }).join("") + "</div>" + (rest.length ? cardsHtml(rest) : ""), "finale-view");
    }

    /* ---------------- flow ---------------- */
    function build() {
      var n = cfg.stars.length;
      steps = [{ t: "intro" }];
      if (n > 3) steps.push({ t: "part", k: cfg.title, title: "Our Stars", line: "From " + ord(n) + " place up to " + ord(4) });
      for (var i = n - 1; i >= 0; i--) {
        var s = cfg.stars[i];
        if (s.rank === 3 && n > 3) { steps.push({ t: "wall" }); steps.push({ t: "part", k: cfg.title, title: "The Top 3", line: "And now, our brightest stars" }); }
        if (s.rank <= 3) { steps.push({ t: "label", s: s }); steps.push({ t: "reveal", s: s }); }
        else steps.push({ t: "reveal", s: s, quiet: true });
      }
      steps.push({ t: "finale" });
    }

    function show(i, dir) {
      idx = i; var st = steps[i];
      cancelTyping();
      if (st.t === "label") {
        clearConfetti(); renderCard(st.s, false, dir > 0); startSuspense(); stopFanfare();
      } else if (st.t === "reveal") {
        stopSuspense(500);
        var same = view && view.dataset.key === "star-" + st.s.rank && !view.classList.contains("revealed");
        if (dir > 0 && same) {
          view.querySelector(".typed").textContent = st.s.rank <= 3 ? WORDS[st.s.rank] + " rank" : "Rank " + st.s.rank;
          view.classList.add("revealed");
        } else {
          clearConfetti();
          renderCard(st.s, !st.quiet || dir <= 0, false, st.quiet);
          // stars 4-10 flip in after a beat, with a small cheer of confetti and no drumroll
          if (st.quiet && dir > 0) setTimeout(function () { if (view) view.classList.add("revealed"); }, 450);
        }
        if (dir > 0) {
          if (st.quiet) setTimeout(function () { burst(0.35); }, 900);
          else { playFanfare(); setTimeout(function () { burst(st.s.rank === 1 ? 1.8 : 1); }, 650); }
        }
      } else {
        stopSuspense(600); clearConfetti();
        if (st.t === "intro") { renderIntro(); stopFanfare(); }
        else if (st.t === "part") renderPart(st.k, st.title, st.line);
        else if (st.t === "wall") { renderWall(); if (dir > 0) setTimeout(function () { burst(0.6); }, 300); }
        else if (st.t === "finale") { renderFinale(); if (dir > 0) { playFanfare(); setTimeout(function () { burst(1.8); }, 300); } }
      }
      updateHud();
    }

    function updateHud() {
      var st = steps[idx], last = idx === steps.length - 1;
      nextBtn.textContent = st.t === "intro" ? "Begin ▶" : st.t === "label" ? "Reveal ▶" : last ? "Restart ↺" : "Next ▶";
      backBtn.disabled = idx === 0;
      $("counter").textContent = (idx + 1) + " / " + steps.length;
    }
    function next() {
      var now = Date.now(); if (now - lastNav < 350) return; lastNav = now;
      if (!steps.length) { location.reload(); return; }
      if (idx >= steps.length - 1) { show(0, -1); return; }
      show(idx + 1, 1);
    }
    function back() {
      var now = Date.now(); if (now - lastNav < 350) return; lastNav = now;
      if (idx > 0) show(idx - 1, -1);
    }

    /* ---------------- input ---------------- */
    stage.addEventListener("click", next);
    nextBtn.addEventListener("click", function (e) { e.stopPropagation(); next(); });
    backBtn.addEventListener("click", function (e) { e.stopPropagation(); back(); });
    $("muteBtn").addEventListener("click", function (e) { e.stopPropagation(); toggleMute(); });
    $("fsBtn").addEventListener("click", function (e) { e.stopPropagation(); toggleFs(); });
    hud.addEventListener("click", function (e) { e.stopPropagation(); });
    tools.addEventListener("click", function (e) { e.stopPropagation(); });
    function toggleMute() {
      muted = !muted; suspense.muted = fanfare.muted = muted;
      $("muteBtn").textContent = muted ? "🔇" : "🔊";
      if (!muted && wantSuspense && suspense.paused) { suspense.volume = 0; safePlay(suspense); fade(suspense, 0.85, 600); }
    }
    function toggleFs() {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
    }
    addEventListener("keydown", function (e) {
      if (e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
      var k = e.key;
      if (k === "ArrowRight" || k === " " || k === "Enter" || k === "PageDown") { e.preventDefault(); next(); }
      else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); back(); }
      else if (k === "f" || k === "F") toggleFs();
      else if (k === "m" || k === "M") toggleMute();
    });
    var hideTimer = null;
    function wake() {
      hud.classList.remove("hide"); tools.classList.remove("hide");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { hud.classList.add("hide"); tools.classList.add("hide"); }, 3500);
    }
    ["mousemove", "touchstart", "keydown"].forEach(function (ev) { addEventListener(ev, wake, { passive: true }); });
    wake();

    /* ---------------- start: results are read once, so they can't change mid-ceremony ---------------- */
    renderMessage("GStar Ceremony", "Loading the GStar leaderboard…");
    fetch(API, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        cfg = data;
        if (data.error || !data.stars || !data.stars.length) {
          steps = [];
          renderMessage("Nothing to reveal yet", esc(data.error || "No student on the GStar leaderboard has earned points yet.") +
            ' <a href="/leaderboard?view=gstar">Open GStar</a>');
          nextBtn.textContent = "Retry ↻"; backBtn.disabled = true; $("counter").textContent = "";
          return;
        }
        build(); show(0, -1);
      })
      .catch(function () {
        steps = [];
        renderMessage("Couldn't load the leaderboard", 'Check the connection and press Retry. <a href="/leaderboard?view=gstar">Open GStar</a>');
        nextBtn.textContent = "Retry ↻"; backBtn.disabled = true;
      });
  })();
  </script>
</body>
</html>
