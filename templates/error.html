{% extends "base.html" %}
{% block title %}{{ title }} — {{ config.portal_title }}{% endblock %}

{% block body %}
<main class="landing">
  <div class="glass card-landing narrow">
    <div class="error-icon">{{ icon | default("🔍") }}</div>
    <h1 class="error-title">{{ title }}</h1>
    <p class="error-message">{{ message }}</p>
    <div class="error-actions">
      <a class="btn-primary" href="{{ action_url | default('/') }}">{{ action_label | default("GO HOME") }}</a>
    </div>
  </div>
</main>
{% endblock %}
